<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI NIDS Analyzer</title>
    <!-- Chart.js ka CDN add kiya hai graph ke liye -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: #161b22;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
        }
        h1 {
            text-align: center;
            color: #58a6ff;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }
        .dashboard-grid {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .main-panel {
            flex: 2;
        }
        .stats-panel {
            flex: 1;
            background-color: #010409;
            padding: 20px;
            border-radius: 5px;
            border: 1px solid #30363d;
            text-align: center;
            display: flex;
            flex-direction: column;
        }
        .input-section {
            margin-bottom: 25px;
        }
        textarea {
            width: 100%;
            height: 80px;
            background-color: #010409;
            color: #58a6ff;
            border: 1px solid #30363d;
            border-radius: 5px;
            padding: 10px;
            font-family: monospace;
            box-sizing: border-box;
        }
        .buttons {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        #scanBtn { background-color: #238636; color: white; width: 100%; margin-top: 10px; padding: 15px; font-size: 16px;}
        #scanBtn:hover { background-color: #2ea043; }
        #loadSampleBtn { background-color: #1f6feb; color: white; flex: 1;}
        #loadSampleBtn:hover { background-color: #388bfd; }
        #loadSafeBtn { background-color: #58a6ff; color: white; flex: 1;}
        #loadSafeBtn:hover { background-color: #79c0ff; }
        #liveBtn { background-color: #d29922; color: black; font-weight: 900; flex: 1;}
        #liveBtn:hover { background-color: #e3b341; }
        #clearBtn { background-color: #21262d; color: #c9d1d9; border: 1px solid #30363d; flex: 1;}
        #clearBtn:hover { background-color: #30363d; }
        
        .result-card {
            display: none;
            background-color: #010409;
            border-left: 5px solid #238636;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
        }
        .malicious { border-left-color: #da3633; }
        .safe { border-left-color: #238636; }
        
        @keyframes pulse-danger {
            0% { box-shadow: 0 0 0 0 rgba(218, 54, 51, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(218, 54, 51, 0); }
            100% { box-shadow: 0 0 0 0 rgba(218, 54, 51, 0); }
        }
        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .badge-malicious { background-color: #da3633; color: white; animation: pulse-danger 1.5s infinite; }
        .badge-safe { background-color: #238636; color: white; }
        
        #aiExplanation {
            color: #ff7b72;
            font-style: italic;
            margin-top: 15px;
            border-top: 1px dashed #30363d;
            padding-top: 10px;
        }
        .chart-container {
            position: relative;
            height: 180px;
            width: 100%;
            margin-top: 10px;
        }
        
        /* Threat Log Table CSS */
        .log-container {
            margin-top: 20px;
            flex-grow: 1;
            max-height: 180px;
            overflow-y: auto;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 5px;
            scrollbar-width: thin;
            scrollbar-color: #30363d #010409;
        }
        .log-container::-webkit-scrollbar { width: 6px; }
        .log-container::-webkit-scrollbar-track { background: #010409; }
        .log-container::-webkit-scrollbar-thumb { background-color: #30363d; border-radius: 10px; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: left;
        }
        th, td {
            padding: 8px;
            border-bottom: 1px solid #30363d;
        }
        th {
            background-color: #21262d;
            position: sticky;
            top: 0;
            color: #c9d1d9;
        }
        .text-safe { color: #238636; font-weight: bold; }
        .text-malicious { color: #da3633; font-weight: bold; }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #8b949e;
            font-size: 14px;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ AI-Powered Network Intrusion Analyzer</h1>
    
    <div class="dashboard-grid">
        <!-- Left Panel: Input & Controls -->
        <div class="main-panel">
            <div class="input-section">
                <label for="packetData"><strong>Raw Network Features:</strong></label><br><br>
                <textarea id="packetData" placeholder="Enter 15 network features here..."></textarea>
                
                <div class="buttons">
                    <button id="loadSampleBtn" onclick="loadSample()" title="Auto-fill malicious DrDoS attack packet">Load Attack</button>
                    <button id="loadSafeBtn" onclick="loadSafeSample()" title="Auto-fill normal benign traffic packet">Load Safe</button>
                    <button id="liveBtn" onclick="fetchLiveTraffic()" title="Fetch a random packet from live dataset">⚡ Live Intercept</button>
                    <button id="autoScanBtn" onclick="toggleAutoScan()" style="background-color: #8957e5; color: white; flex: 1;" title="Simulate continuous live traffic monitoring">▶️ Auto-Scan</button>
                    <button id="clearBtn" onclick="clearDashboard()" title="Reset the dashboard inputs">🗑️ Clear</button>
                </div>
                <button id="scanBtn" onclick="analyzeTraffic()">Scan Traffic</button>
            </div>

            <div id="resultCard" class="result-card">
                <h3>Analysis Result:</h3>
                <span id="statusBadge" class="status-badge"></span>
                <p><strong>Prediction Code:</strong> <span id="predCode"></span></p>
                <div id="aiExplanation"></div>
                
                <!-- Download Button -->
                <button id="downloadBtn" onclick="downloadReport()" style="display: none; background-color: #388bfd; color: white; margin-top: 15px; width: 100%;">📄 Download Incident Report</button>
            </div>
        </div>

        <!-- Right Panel: Live Statistics & Threat Logs -->
        <div class="stats-panel">
            <h3 style="margin-top: 0;">📊 Live Traffic Stats</h3>
            <p style="margin: 5px 0;">Total Scanned: <strong id="totalCount" style="color: #58a6ff;">0</strong></p>
            <div class="chart-container">
                <canvas id="trafficChart"></canvas>
            </div>
            
            <!-- Threat Log Table -->
            <h4 style="margin: 15px 0 5px 0; border-top: 1px solid #30363d; padding-top: 10px;">📜 Live Threat Log</h4>
            <div class="log-container">
                <table id="threatLogTable">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="threatLogBody">
                        <!-- Logs added via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="footer">
    Developed with 💻 by Manish Sharma | B.Tech CSE (2023-2027) • <b>v1.0.1</b>
</div>

<script>
    let safeCount = 0;
    let maliciousCount = 0;
    let totalCount = 0;

    const ctx = document.getElementById('trafficChart').getContext('2d');
    const trafficChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Safe', 'Malicious'],
            datasets: [{
                data: [0, 0],
                backgroundColor: ['#238636', '#da3633'],
                borderColor: '#010409',
                borderWidth: 3
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    labels: { color: '#c9d1d9' },
                    position: 'bottom'
                }
            }
        }
    });

    function updateStats(isMalicious) {
        totalCount++;
        if (isMalicious) {
            maliciousCount++;
        } else {
            safeCount++;
        }
        
        document.getElementById('totalCount').innerText = totalCount;
        trafficChart.data.datasets[0].data = [safeCount, maliciousCount];
        trafficChart.update();
    }

    function addLogEntry(status) {
        const tbody = document.getElementById('threatLogBody');
        const row = document.createElement('tr');
        
        const time = new Date().toLocaleTimeString();
        let statusHtml, actionHtml;
        
        if (status === 'Malicious') {
            statusHtml = `<span class="text-malicious">🔴 Malicious</span>`;
            actionHtml = `<span class="text-malicious">Blocked</span>`;
        } else {
            statusHtml = `<span class="text-safe">🟢 Safe</span>`;
            actionHtml = `<span class="text-safe">Allowed</span>`;
        }
        
        row.innerHTML = `<td>${time}</td><td>${statusHtml}</td><td>${actionHtml}</td>`;
        tbody.insertBefore(row, tbody.firstChild);
    }

    function loadSample() {
        document.getElementById('packetData').value = "17, 49830, 4, 0, 2048, 0, 512.0, 0.0, 80.2, 0.0, 16610.0, 0.0, 16610.0, 80.2, 41062.4";
    }

    function loadSafeSample() {
        document.getElementById('packetData').value = "6, 80, 2, 0, 1024, 0, 256.0, 0.0, 40.0, 0.0, 8000.0, 0.0, 8000.0, 40.0, 20000.0";
    }

    async function fetchLiveTraffic() {
        const btn = document.getElementById('liveBtn');
        btn.innerText = "Intercepting...";
        try {
            const response = await fetch('/get_live_traffic');
            const data = await response.json();
            
            document.getElementById('packetData').value = data.raw_data;
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('downloadBtn').style.display = 'none';
        } catch (error) {
            alert("Live traffic intercept fail ho gaya!");
        } finally {
            btn.innerText = "⚡ Live Intercept";
        }
    }

    function clearDashboard() {
        document.getElementById('packetData').value = "";
        document.getElementById('resultCard').style.display = 'none';
        document.getElementById('downloadBtn').style.display = 'none';
        document.getElementById('scanBtn').innerText = "Scan Traffic";
    }

    async function analyzeTraffic() {
        const rawData = document.getElementById('packetData').value;
        if(!rawData) {
            alert("Please enter network features first!");
            return;
        }

        const featuresArray = rawData.split(',').map(item => parseFloat(item.trim()));
        document.getElementById('scanBtn').innerText = "Scanning...";
        
        try {
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ features: featuresArray })
            });

            const result = await response.json();
            const resultCard = document.getElementById('resultCard');
            const statusBadge = document.getElementById('statusBadge');
            
            resultCard.style.display = 'block';
            document.getElementById('downloadBtn').style.display = 'block';
            document.getElementById('predCode').innerText = result.prediction_code;
            statusBadge.innerText = result.status;

            if(result.status === 'Malicious') {
                resultCard.className = 'result-card malicious';
                statusBadge.className = 'status-badge badge-malicious';
                document.getElementById('aiExplanation').innerHTML = `<strong>🤖 Gemini Analysis:</strong><br>${result.ai_explanation}`;
                updateStats(true);
                addLogEntry('Malicious');
            } else {
                resultCard.className = 'result-card safe';
                statusBadge.className = 'status-badge badge-safe';
                document.getElementById('aiExplanation').innerHTML = "";
                updateStats(false);
                addLogEntry('Safe');
            }
        } catch (error) {
            alert("Error connecting to server. Is app.py running?");
        } finally {
            document.getElementById('scanBtn').innerText = "Scan Traffic";
        }
    }

    function downloadReport() {
        const status = document.getElementById('statusBadge').innerText;
        const code = document.getElementById('predCode').innerText;
        const aiText = document.getElementById('aiExplanation').innerText || "No AI explanation available (Safe Traffic).";
        const packet = document.getElementById('packetData').value;
        const timestamp = new Date().toLocaleString();

        const reportContent = `====================================\n🛡️ AI-NIDS INCIDENT REPORT\n====================================\n\n🕒 Date & Time: ${timestamp}\n🚨 Status: ${status}\n🔢 Prediction Code: ${code}\n\n📦 [RAW PACKET FEATURES]\n${packet}\n\n🤖 [AI ANALYSIS & MITIGATION]\n${aiText}\n\n====================================\nGenerated by AI-NIDS Analyzer`;

        const blob = new Blob([reportContent], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Incident_Report_${Date.now()}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
    // Auto-Scan Variables and Logic
    let isAutoScanning = false;
    let autoScanTimer = null;

    async function runAutoScanCycle() {
        if (!isAutoScanning) return;
        
        // Pehle packet fetch karo
        await fetchLiveTraffic();
        
        // Phir usko scan karo
        await analyzeTraffic();
        
        // Agar abhi bhi scanning ON hai, toh 3 second baad fir repeat karo
        if (isAutoScanning) {
            autoScanTimer = setTimeout(runAutoScanCycle, 3000);
        }
    }

    function toggleAutoScan() {
        const btn = document.getElementById('autoScanBtn');
        if (!isAutoScanning) {
            // Start Auto-Scan
            isAutoScanning = true;
            btn.innerHTML = "🛑 Stop Scan";
            btn.style.backgroundColor = "#da3633"; // Red color jab active ho
            runAutoScanCycle();
        } else {
            // Stop Auto-Scan
            isAutoScanning = false;
            clearTimeout(autoScanTimer);
            btn.innerHTML = "▶️ Auto-Scan";
            btn.style.backgroundColor = "#8957e5"; // Wapas purple color
        }
    }
</script>

</body>
</html>
